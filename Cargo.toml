[package]
name = "drew-physics"
version = "0.1.0"
edition = "2024"
authors = ["Jorge Andre Castro"]
description = "Moteur de simulation physique 2D agnostique, no_std, sans allocation et optimisé f32"
license = "GPL-2.0-or-later"
repository = "https://github.com/jorgeandrecastro/drew-physics"
readme = "README.md"
keywords = ["physics", "2d", "no_std", "game-development", "simulation"]
categories = ["game-engines", "no-std", "science"]

[lib]
name = "drew_physics"
path = "src/lib.rs"

[[example]]
name = "simulation"
path = "examples/simulation.rs"

[dependencies]
# Zéro dépendance pour garantir le support no_std universel